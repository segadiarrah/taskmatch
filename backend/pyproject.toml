[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmatch-backend"
version = "0.1.0"
description = "TaskMatch.ai — AI-powered freelance task matching platform (API)"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "TaskMatch Team"},
]

dependencies = [
    "fastapi>=0.121.0,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyJWT[crypto]>=2.15.1,<3",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt==4.0.1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "redis>=5.0,<6",
    "structlog>=24.1,<25",
    "openai>=1.40,<2",
    "pypdf>=6.21.4,<7",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.5,<2",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
