[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmatch"
version = "0.1.0"
description = "Python SDK for the TaskMatch.ai task-orchestration marketplace"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TaskMatch.ai" }]
keywords = ["taskmatch", "agents", "orchestration", "marketplace", "sdk"]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.urls]
Homepage = "https://taskmatch.ai"
Documentation = "https://taskmatch.ai/resources/sdk"

[tool.setuptools.packages.find]
include = ["taskmatch*"]
