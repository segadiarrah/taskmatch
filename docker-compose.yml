services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmatch}
      POSTGRES_DB: ${POSTGRES_DB:-taskmatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmatch} -d ${POSTGRES_DB:-taskmatch}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskmatch_net

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - taskmatch_net

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    labels:
      org.opencontainers.image.revision: "${TASKMATCH_REVISION:-unknown}"
      ai.taskmatch.deployed-at: "${TASKMATCH_DEPLOYED_AT:-unknown}"
    restart: unless-stopped
    env_file: .env
    environment:
      - ENV=${ENV:-development}
      - PROVIDER_DATA_DIR=/appdata
      - UPLOAD_DIR=/appdata/uploads
    volumes:
      - ./backend:/app
      - backend_appdata:/appdata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - taskmatch_net

  # Durable Stripe events, transfers and refunds; starts after migrations.
  billing-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    labels:
      org.opencontainers.image.revision: "${TASKMATCH_REVISION:-unknown}"
      ai.taskmatch.deployed-at: "${TASKMATCH_DEPLOYED_AT:-unknown}"
    restart: unless-stopped
    env_file: .env
    environment:
      - ENV=${ENV:-development}
      - PROVIDER_DATA_DIR=/appdata
      - UPLOAD_DIR=/appdata/uploads
    volumes:
      - ./backend:/app
      - backend_appdata:/appdata
    command: ["python", "-m", "app.services.billing_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; p=pathlib.Path('/tmp/taskmatch-billing-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 90"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - taskmatch_net

  mail-worker:
    build: ./backend
    labels:
      org.opencontainers.image.revision: "${TASKMATCH_REVISION:-unknown}"
      ai.taskmatch.deployed-at: "${TASKMATCH_DEPLOYED_AT:-unknown}"
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.services.mail_worker"]
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; p=pathlib.Path('/tmp/taskmatch-mail-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 120"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - taskmatch_net

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://taskmatch.ai}
        API_INTERNAL_URL: http://backend:8000
    labels:
      org.opencontainers.image.revision: "${TASKMATCH_REVISION:-unknown}"
      ai.taskmatch.deployed-at: "${TASKMATCH_DEPLOYED_AT:-unknown}"
    restart: unless-stopped
    environment:
      - API_INTERNAL_URL=http://backend:8000
      - NODE_ENV=production
    # Production: serve the image's built app (`next start` from the Dockerfile
    # CMD). No source bind-mount / anon volumes so the compiled build is used.
    command: ["npm", "run", "start"]
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskmatch_net

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-127.0.0.1:8091}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - taskmatch_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_appdata:
    driver: local

networks:
  taskmatch_net:
    driver: bridge
