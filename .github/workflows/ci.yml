name: Verify TaskMatch

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmatch
          POSTGRES_PASSWORD: taskmatch
          POSTGRES_DB: taskmatch_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmatch -d taskmatch_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://taskmatch:taskmatch@localhost:5432/taskmatch_ci_test
      TEST_DATABASE_URL: postgresql+asyncpg://taskmatch:taskmatch@localhost:5432/taskmatch_ci_test
      REDIS_URL: redis://localhost:6379/0
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -c backend/requirements.lock -r backend/requirements.txt
      - run: alembic upgrade head && alembic check
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
      - run: PYTHONPATH=sdk/python python -m pytest sdk/python/tests -q

  web-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm ci && npm test
        working-directory: sdk/js
