name: Verify TaskMatch

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmatch
          POSTGRES_PASSWORD: taskmatch
          POSTGRES_DB: taskmatch_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmatch -d taskmatch_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://taskmatch:taskmatch@localhost:5432/taskmatch_ci_test
      TEST_DATABASE_URL: postgresql+asyncpg://taskmatch:taskmatch@localhost:5432/taskmatch_ci_test
      REDIS_URL: redis://localhost:6379/0
      LLM_ENABLED: "false"
      # The billing integration suite uses an in-process HTTP fixture. These
      # markers enable that fixture and have no corresponding provider account.
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: sk_test_fixture_only
      STRIPE_WEBHOOK_SECRET: whsec_fixture_only
      STRIPE_CONNECT_WEBHOOK_SECRET: whsec_fixture_connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -c backend/requirements.lock -r backend/requirements.txt
      - run: alembic upgrade head && alembic check
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
      - run: PYTHONPATH=sdk/python python -m pytest sdk/python/tests -q

  web-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and provision isolated browser APIs
        env:
          TASKMATCH_JOURNEY_IMAGE_TAG: ci
        run: |
          docker build -t taskmatch-backend:ci backend
          docker build -t taskmatch-frontend:ci frontend
          python3 tools/journey-tests/provision.py
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3170
          TASKMATCH_E2E_API: http://127.0.0.1:3171
          TASKMATCH_E2E_PAID_API: http://127.0.0.1:3172
        working-directory: frontend
      - run: node tools/journey-tests/registration_matrix.cjs
      - run: npm ci --ignore-scripts --prefix tools/journey-tests/protocol-clients && npm test --prefix tools/journey-tests/protocol-clients -- http://127.0.0.1:3172
      - run: npm ci && npm test
        working-directory: sdk/js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./sdk/python
      - name: SDK journeys through both isolated APIs
        run: |
          python tools/journey-tests/sdk_python.py --api http://127.0.0.1:3171
          python tools/journey-tests/sdk_python.py --api http://127.0.0.1:3172 --human
          node tools/journey-tests/sdk_js.mjs --api http://127.0.0.1:3171
          node tools/journey-tests/sdk_js.mjs --api http://127.0.0.1:3172 --human
